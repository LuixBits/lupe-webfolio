<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sample interactive build</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				background: #241046;
				overflow: hidden;
			}
			canvas {
				display: block;
				width: 100%;
				height: 100%;
			}
			.hint {
				position: fixed;
				left: 50%;
				bottom: 10px;
				transform: translateX(-50%);
				color: #c8a6ef;
				font: 12px/1.4 monospace;
				letter-spacing: 0.08em;
				user-select: none;
			}
		</style>
	</head>
	<body>
		<!-- Stand-in for a Unity WebGL build: proves the embed pipeline (sandboxed
		     same-origin iframe, aspect box, fullscreen) with a tiny pointer toy. -->
		<canvas id="c"></canvas>
		<div class="hint">SAMPLE BUILD — drag to orbit</div>
		<script>
			const c = document.getElementById('c');
			const x = c.getContext('2d');
			let w, h, t = 0, ax = 0.6, ay = 0.35, drag = null;
			const fit = () => { w = c.width = innerWidth * devicePixelRatio; h = c.height = innerHeight * devicePixelRatio; };
			addEventListener('resize', fit); fit();
			const P = [];
			for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) for (let k = 0; k < 8; k++)
				if (i % 7 === 0 || j % 7 === 0 || k % 7 === 0) P.push([i - 3.5, j - 3.5, k - 3.5]);
			c.addEventListener('pointerdown', (e) => (drag = [e.clientX, e.clientY]));
			addEventListener('pointerup', () => (drag = null));
			addEventListener('pointermove', (e) => {
				if (!drag) return;
				ay += (e.clientX - drag[0]) * 0.008; ax += (e.clientY - drag[1]) * 0.008;
				drag = [e.clientX, e.clientY];
			});
			const loop = () => {
				t += 0.004;
				x.fillStyle = '#241046'; x.fillRect(0, 0, w, h);
				const s = Math.min(w, h) / 14;
				for (const [px, py, pz] of P) {
					const y1 = py * Math.cos(ax) - pz * Math.sin(ax);
					const z1 = py * Math.sin(ax) + pz * Math.cos(ax);
					const x2 = px * Math.cos(ay + t) + z1 * Math.sin(ay + t);
					const z2 = -px * Math.sin(ay + t) + z1 * Math.cos(ay + t);
					const d = 8 / (8 + z2);
					x.fillStyle = z2 > 0 ? '#ff5ed1' : '#35e6e6';
					x.globalAlpha = 0.4 + d * 0.5;
					x.fillRect(w / 2 + x2 * s * d, h / 2 + y1 * s * d, 2.4 * d * devicePixelRatio, 2.4 * d * devicePixelRatio);
				}
				x.globalAlpha = 1;
				requestAnimationFrame(loop);
			};
			loop();
		</script>
	</body>
</html>
